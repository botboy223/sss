<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Scanner Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <h1>Shop Barcode Scanner</h1>
        <div class="section">
            <div id="barcode-scanner"></div>
            <button onclick="startScanning()">Start Scanning</button>
            <div id="product-details">
                <h2>Product Details</h2>
                <form id="product-form">
                    <label>Barcode: <input type="text" id="barcode" readonly></label><br>
                    <label>Product Name: <input type="text" id="product-name"></label><br>
                    <label>Price: <input type="number" id="price"></label><br>
                    <label>Expiry Date: <input type="date" id="expiry-date"></label><br>
                    <button type="button" onclick="addProduct()">Add Product</button>
                </form>
            </div>
            <div id="bill-section">
                <h2>Bill</h2>
                <div id="bill"></div>
                <button onclick="generateBill()">Generate Bill</button>
            </div>
            <div id="bill-history-section">
                <h2>Bill History</h2>
                <div id="bill-history"></div>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="script.js"></script>
</body>
</html>
